[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cornilia"
version = "0.1.0"
description = "A small, provider-agnostic Python agent framework: the agent loop, conversation memory and pluggable tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.58"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]
dev = ["pytest>=8"]
# examples/web_tools: fetching pages, tables and datasets. lxml is what pandas.read_html parses with, openpyxl reads .xlsx
web = ["httpx>=0.27", "trafilatura>=1.12", "pandas>=2.0", "pyarrow>=14", "pydantic>=2", "lxml>=5", "openpyxl>=3.1"]
# the optional web_search tool in examples/web_tools
web-search = ["ddgs>=9"]

[project.scripts]
cornilia = "cornilia.main:RunChat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
